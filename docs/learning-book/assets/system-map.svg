<path d="M747 137v20H153v20" fill="none" stroke="#397c66" stroke-width="2"/>
<rect x="28" y="278" width="844" height="47" fill="#eee6ed" rx="4"/>
<text x="46" y="307" font-size="17" fill="#6d3455">Optional specialization: data pipelines, ML and retrieval. No authority to place orders.</text>
