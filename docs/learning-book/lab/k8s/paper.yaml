apiVersion: v1
kind: ServiceAccount
metadata:
  name: paper-api
  namespace: paper-school
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paper-settings
  namespace: paper-school
data:
  PAPERLAB_DB: /data/paperlab.sqlite3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-api
  namespace: paper-school
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paper-api
  template:
    metadata:
      labels:
        app: paper-api
    spec:
      serviceAccountName: paper-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: paper-school:lesson1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8015
          envFrom:
            - configMapRef:
                name: paper-settings
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paper-api
  namespace: paper-school
spec:
  type: ClusterIP
  selector:
    app: paper-api
  ports:
    - name: http
      port: 80
      targetPort: http
